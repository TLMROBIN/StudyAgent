worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  resolver 127.0.0.11 valid=30s ipv6=off;

  # The school gateway forwards the original device address; all other peers
  # remain untrusted so direct clients cannot spoof their per-IP stream limit.
  set_real_ip_from 10.50.159.62;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  limit_conn_zone $binary_remote_addr zone=perip:10m;

  map "$realip_remote_addr:$http_x_forwarded_proto" $campus_sso_proto {
    default $scheme;
    "10.50.159.62:https" https;
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Let nginx accept files slightly above the app's 50 MB limit so the backend
    # can return a consistent validation error instead of an early 413.
    client_max_body_size 64m;

    rewrite ^/studyagent(/api/.*)$ $1 last;

    location /api/chat/stream {
      # SSE 是长连接，只在流式接口上限制单 IP 并发，避免误伤前端首屏静态资源加载
      limit_conn perip 2;
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_read_timeout 300s;
      chunked_transfer_encoding on;
    }

    location /api/ {
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location ~ ^/(?:studyagent/)?login$ {
      if ($arg_token != "") {
        rewrite ^ /sso last;
      }
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }

    location ~ ^/(?:studyagent/)?sso(?:/confirm)?$ {
      access_log off;
      error_log /dev/stderr crit;
      set $backend http://backend:8000;
      rewrite ^/studyagent(/sso.*)$ $1 break;
      proxy_pass $backend;
      proxy_redirect off;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $campus_sso_proto;
    }

    # Prometheus 与部署巡检直连 backend:8000 / 127.0.0.1:8002 抓取，不对网关暴露
    location /metrics {
      deny all;
    }

    location = /health {
      set $backend http://backend:8000;
      proxy_pass $backend;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /studyagent/assets/ {
      alias /usr/share/nginx/html/assets/;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store";
    }
  }
}
